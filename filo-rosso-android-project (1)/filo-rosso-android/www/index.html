  const wUp=s=>()=>{btn[s]=false;hs=btn[-1]?-1:btn[1]?1:0;if(st==='play'){if(hs)pickAnchor(hs);else web=null}};
  mkBtn('SALTO','right:18px;bottom:18px;width:84px;height:84px',()=>key('Space',true,' '),()=>key('Space',false,' '));
  mkBtn('\ud83d\udd78L<small>sinistra</small>','right:18px;bottom:112px;width:72px;height:72px',wDown(-1),wUp(-1));
  mkBtn('\ud83d\udd78R<small>destra</small>','right:112px;bottom:18px;width:72px;height:72px',wDown(1),wUp(1));
  mkBtn('Q','right:112px;bottom:96px;width:54px;height:54px',...hold('KeyQ','q'));
  mkBtn('E','right:196px;bottom:18px;width:54px;height:54px',...hold('KeyE','e'));
  mkBtn('C','right:196px;bottom:82px;width:54px;height:54px',()=>key('KeyC',true,'c'),()=>key('KeyC',false,'c'));
  mkBtn('\u25bc','right:112px;bottom:172px;width:54px;height:54px',()=>key('ShiftLeft',true,''),()=>key('ShiftLeft',false,'')).id='bdn';
  mkBtn('\ud83d\udc41','left:calc(50% - 56px);top:10px;width:44px;height:44px',()=>{key('KeyV',true,'v');key('KeyV',false,'v')});
  mkBtn('\u2630','left:calc(50% + 12px);top:10px;width:44px;height:44px',()=>{if(!paused){paused=true;showMenu('PAUSA','Tocca per riprendere')}});
  // cheat icons (top right)
  const SVG={
    mg:`<svg viewBox='0 0 40 28' width='30' height='22'><g fill='none' stroke='#cfe' stroke-width='2' stroke-linecap='round'><path d='M2 8h20M2 12h20M2 16h20'/><rect x='22' y='5' width='9' height='14' rx='2' fill='#19e3ff'/><path d='M27 19l-2 7h6l2-7M31 12h6'/></g></svg>`,
    orc:`<svg viewBox='0 0 32 32' width='30' height='30'><circle cx='16' cy='17' r='11' fill='#3da64f'/><path d='M7 11l-4-6 8 3M25 11l4-6-8 3' fill='#3da64f'/><circle cx='11.5' cy='15' r='2' fill='#ffc21a'/><circle cx='20.5' cy='15' r='2' fill='#ffc21a'/><path d='M11 22l-1-5M21 22l1-5' stroke='#fff' stroke-width='2.4' stroke-linecap='round'/><path d='M12 24h8' stroke='#0d3a18' stroke-width='2'/></svg>`,
    boot:`<svg viewBox='0 0 32 32' width='30' height='30'><path d='M9 3h9v12l9 4c2 1 3 3 3 5v3H6V3z' fill='#7a4524'/><rect x='6' y='25' width='24' height='4' fill='#1b1b1b'/><rect x='9' y='3' width='9' height='4' fill='#ff2e88'/></svg>`,
    clock:`<svg viewBox='0 0 32 32' width='30' height='30'><circle cx='16' cy='16' r='12' fill='#150a2e' stroke='#ffb800' stroke-width='2.5'/><path d='M16 8v8l6 4' stroke='#ffb800' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>`};
  mkBtn(SVG.mg,'right:12px;top:10px;width:46px;height:46px',()=>{minigun=!minigun;msg(minigun?'MINIGUN attivata (tieni premuto Q o E)':'Minigun disattivata')}).id='cmg';
  mkBtn(SVG.orc,'right:64px;top:10px;width:46px;height:46px',()=>{if(st==='play')startBoss()});
  mkBtn(SVG.boot,'right:116px;top:10px;width:46px;height:46px',()=>{if(st==='play'&&world==='city'&&!bootEv&&!nfx)startBoot()});
  mkBtn(SVG.clock,'right:168px;top:10px;width:46px;height:46px',()=>{if((st==='play'||st==='plane')&&!nfx)startNext()});
  // QTE keypad + overlay taps
  $('qte').addEventListener('pointerdown',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.preventDefault();key('Key'+k,true,k.toLowerCase());key('Key'+k,false,k.toLowerCase())}});
  ov.addEventListener('pointerdown',e=>{
    if(e.target.closest&&e.target.closest('.opt'))return;
    try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(_){}
    if(paused)resumeGame();else begin()})}
// --- render ---
function pose(dt){
  if(st==='title'){titlePose(dt);return}
  const sp=Math.hypot(p.vx,p.vz),boss_=st==='boss';
  man.position.set(p.x,p.y,p.z);
  const tg=boss_?0:atk?atk.face:(Math.hypot(p.vx,p.vz)>.3?Math.atan2(-p.vx,-p.vz):yaw);yaw+=Math.atan2(Math.sin(tg-yaw),Math.cos(tg-yaw))*Math.min(1,(atk?14:6)*dt);man.rotation.y=yaw;
  man.rotation.x+=(cl(p.vy*.014,-.6,.6)-man.rotation.x)*Math.min(1,5*dt);
  if(boss_){armL.rotation.set(1.45,0,-.05);armR.rotation.set(1.45,0,.05);legL.rotation.x=legR.rotation.x=0}
  else if(web){const i=web.side<0?0:1;arms[i].rotation.set(2.75,0,i?.12:-.12);arms[1-i].rotation.set(.4,0,i?-.3:.3);legL.rotation.x=legR.rotation.x=-.45}
  else if(grounded){const s=Math.sin(T*14)*.9;armL.rotation.set(s,0,-.1);armR.rotation.set(-s,0,.1);legL.rotation.x=-s;legR.rotation.x=s}
  else{armL.rotation.set(.5+Math.sin(T*3)*.15,0,-.3);armR.rotation.set(.5,0,.3);legL.rotation.x=-.55;legR.rotation.x=-.2}
  anim(dt,boss_);man.visible=st!=='plane'&&!(fpv&&st==='play');man.updateMatrixWorld(true);
  wl[0].visible=wl[1].visible=anchorDot.visible=false;
  if(web&&st==='play'){
    const i=web.side<0?0:1,an=new V(web.ax,web.ay,web.az);webT=Math.min(1,webT+dt*9);
    const w=[elL,elR][i].localToWorld(new V(0,-.45,0));setWeb(wl[i],w,w.clone().lerp(an,webT));wl[i].visible=true;
    anchorDot.position.copy(an);anchorDot.visible=webT>=1}
  else if(boss_||st==='play'){for(let i=0;i<2;i++)if(shotT[i]>0){shotT[i]-=dt;setWeb(wl[i],[elL,elR][i].localToWorld(new V(0,-.45,0)),shotEnd[i]);wl[i].visible=true}}
  if(boss_&&boss){
    cam.fov+=(62-cam.fov)*Math.min(1,3*dt);
    cam.position.lerp(new V(p.x,p.y+5,p.z+16),1-Math.exp(-4*dt));cam.lookAt(boss.g.position.x,30,boss.g.position.z);
  }else{
    cam.fov+=(cl(62+sp*.28,62,92)-cam.fov)*Math.min(1,3*dt);
    const k=1-Math.exp(-4*dt);
    const sy=Math.sin(camYaw),cy=Math.cos(camYaw);
    if(fpv&&st==='play'){cam.position.set(p.x-sy*.25,p.y+.8,p.z-cy*.25);cam.fov=78+cl(sp*.2,0,18)}
    else{const ph=cl(.25-look*.9,-.15,1.25),dd=st==='plane'?30:17;cam.position.x+=(p.x+sy*dd*Math.cos(ph)-cam.position.x)*k;cam.position.y+=(p.y+3+dd*Math.sin(ph)-cam.position.y)*k;cam.position.z+=(p.z+cy*dd*Math.cos(ph)-cam.position.z)*k}
    if(fpv&&st==='play'){const c2=Math.cos(look);cam.lookAt(cam.position.x-sy*c2*30,cam.position.y+Math.sin(look)*30,cam.position.z-cy*c2*30)}else cam.lookAt(p.x-sy*22,p.y+1,p.z-cy*22)}
  cam.updateProjectionMatrix();
  moon.position.set(0,150,p.z-750);ground.position.set(Math.round(p.x/C)*C,0,Math.round(p.z/C)*C);grid.position.set(Math.round(p.x/4)*4,.03,Math.round(p.z/4)*4);
  for(const m of cells){m.position.y+=Math.sin(T*3+m.position.z)*.01;m.scale.setScalar(1+Math.sin(T*5+m.position.x)*.12)}}

reset();cam.position.set(0,35,17);
let last=performance.now();
function loop(now){
  let dt=Math.min(.033,(now-last)/1000);last=now;if(paused)dt=0;T+=dt;
  ts+=((qte?.06:1)-ts)*Math.min(1,12*dt);
  if(st==='play'||st==='plane'){for(let n=0;n<(nfx?3:1);n++){if(st==='play'){step(dt);miniStep(dt)}else if(st==='plane')planeStep(dt)}}
  else if(st==='boss'&&boss)bossStep(dt,dt*ts);
  else if(st==='title'){p.y=30+Math.sin(T*1.5)*1.5;p.vy=0;p.vx=0;p.vz=-22}
  document.body.classList.toggle('t',st==='title');if(bootEv)bootStep(dt);if(nfx)fxStep(dt);if(shake>0)shake-=dt;pose(dt);if(shake>0){cam.position.x+=rnd(-1,1)*shake*5;cam.position.y+=rnd(-1,1)*shake*5}
  $('sc').innerHTML=score()+' pt<small>'+Math.max(0,Math.floor(-p.z))+' m · celle '+got+'</small>';
  $('tm').innerHTML=Math.ceil(left)+' s<small>record '+best+'</small>';
  $('hp').firstChild.style.width=Math.max(0,hp)+'%';
  if(boss)$('bh').firstChild.style.width=Math.max(0,boss.hp/boss.max*100)+'%';
  const q=$('qte');
  if(qte){q.className='on';q.innerHTML='<div class="ql">'+qte.seq.map((c,i)=>'<span class="'+(i<qte.i?'d':i===qte.i?'c':'')+'">'+c+'</span>').join('')+'</div><div class="qb"><i style="width:'+qte.tm/3*100+'%"></i></div><p>Schiva il masso!</p>'+(touchMode?'<div class=kp>'+KP+'</div>':'')}
  else if(q.className)q.className='';
  dl.position.set(p.x-50,p.y+110,p.z+40);dl.target.position.set(p.x,p.y,p.z);dl.target.updateMatrixWorld();updHud();R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
